name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    name: publish @tchr/genesis-cli
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          registry-url: 'https://registry.npmjs.org'
          scope: '@tchr'
      - name: install
        run: npm ci
      - name: sync-assets (prepack faz, mas garantimos)
        run: npm run sync-assets --workspace=@tchr/genesis-cli
      - name: build
        run: npm run build --workspace=@tchr/genesis-cli
      - name: test
        run: npm test --workspace=@tchr/genesis-cli
      - name: publish (provenance)
        working-directory: packages/cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public
      - name: github release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            packages/cli/CHANGELOG.md
